name: Build Armbian Image (Tanix TX6)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "armbian_board"
        required: true
        default: "tanix-tx6"
      kernel_branch:
        description: "armbian_kernel_branch (current/edge/legacy)"
        required: true
        default: "current"
      release:
        description: "armbian_release (userspace codename)"
        required: true
        default: "resolute"
      ui:
        description: "armbian_ui (server/minimal/desktop UI name)"
        required: true
        default: "server"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: armbian/build@main
        with:
          armbian_token: ${{ secrets.GITHUB_TOKEN }}
          armbian_runner_clean: "yes"
          armbian_target: "build"
          armbian_board: ${{ inputs.board }}
          armbian_kernel_branch: ${{ inputs.kernel_branch }}
          armbian_release: ${{ inputs.release }}
          armbian_ui: ${{ inputs.ui }}
          armbian_release_title: "Tanix TX6 ${{ inputs.release }} (${{ inputs.ui }})"
          armbian_release_body: |
            Automated Armbian build for Tanix TX6.

            - board: ${{ inputs.board }}
            - kernel_branch: ${{ inputs.kernel_branch }}
            - release: ${{ inputs.release }}
            - ui: ${{ inputs.ui }}
